<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Your Plan – Genesis Craft AI</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-HS1Z82VML7"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-HS1Z82VML7');
    </script>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
        font-family: 'Inter', sans-serif;
        color: #e2e8f0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .site-header {
        background: #0a0a0a;
        border-bottom: 1px solid #1e293b;
        padding: 1rem 2rem;
      }
      .header-container {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
      }
      .logo a {
        font-size: 1.5rem;
        font-weight: 800;
        background: linear-gradient(135deg, #fff, #94a3b8);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-decoration: none;
      }
      .main-nav ul {
        display: flex;
        gap: 2rem;
        list-style: none;
      }
      .main-nav a {
        color: #cbd5e1;
        text-decoration: none;
        font-weight: 500;
      }
      .main-nav a:hover { color: #3b82f6; }
      .btn-small {
        background: #3b82f6;
        color: white;
        padding: 0.5rem 1rem;
        border-radius: 40px;
        text-decoration: none;
        font-weight: 600;
      }
      .logout-btn {
        background: #ef4444;
        border: none;
        padding: 0.4rem 1rem;
        border-radius: 40px;
        color: white;
        cursor: pointer;
        margin-left: 0.5rem;
      }
      .logout-btn:hover { background: #dc2626; }
      .container {
        max-width: 900px;
        margin: 2rem auto;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        font-size: 2rem;
        margin-bottom: 1rem;
        background: linear-gradient(135deg, #fff, #94a3b8);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .subhead { color: #94a3b8; margin-bottom: 2rem; }
      .pricing-grid {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 1.5rem;
        margin: 2rem 0;
      }
      .plan-card {
        background: #0f172a;
        border-radius: 24px;
        padding: 1.5rem;
        flex: 1;
        min-width: 240px;
        border: 1px solid #1e293b;
        transition: transform 0.2s;
        cursor: pointer;
      }
      .plan-card:hover { transform: translateY(-5px); border-color: #3b82f6; }
      .plan-name { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
      .plan-price { font-size: 1.2rem; color: #3b82f6; margin-bottom: 1rem; }
      .plan-features { list-style: none; margin: 1rem 0; text-align: left; }
      .plan-features li {
        margin: 0.6rem 0;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.85rem;
      }
      .plan-features i { color: #10b981; width: 1.2rem; }
      .select-btn {
        background: #3b82f6;
        color: white;
        border: none;
        padding: 0.6rem 1rem;
        border-radius: 40px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
        margin-top: 1rem;
      }
      .select-btn:hover { background: #2563eb; }
      .footer {
        margin-top: auto;
        background: #0f172a;
        border-top: 1px solid #1e293b;
        padding: 2rem;
        text-align: center;
      }
      @media (max-width: 700px) {
        .header-container { flex-direction: column; gap: 1rem; }
        .main-nav ul { gap: 1rem; flex-wrap: wrap; justify-content: center; }
      }
    </style>
</head>
<body>
  <header class="site-header">
  <div class="header-container">
    <div class="logo">
      <a href="/index.html">Genesis Craft AI</a>
    </div>
    <nav class="main-nav">
      <ul>
        <li><a href="/product.html">Product</a></li>
        <li><a href="/pricing.html">Pricing</a></li>
        <li><a href="/about.html">About Us</a></li>
        <li><a href="/careers.html">Careers</a></li>
        <li><a href="/contact.html">Contact</a></li>
      </ul>
    </nav>
    <div class="header-cta">
      <a href="/signup.html" class="btn-small">Sign Up</a>
      <button id="logoutBtn" class="logout-btn">Log Out</button>
    </div>
  </div>
</header>

    <h1>Choose your plan</h1>
    <div id="plan-selection" style="display: none;">
        <button data-plan="free">Free</button>
        <button data-plan="pro">Pro</button>
        <button data-plan="team">Team</button>
    </div>
    <div id="loading" style="display: block;">Loading...</div>

    <script>
        window.netlifyIdentity.init();

        async function processConfirmationToken() {
            const user = window.netlifyIdentity.currentUser();

            // If user is already logged in and has a plan, redirect to pricing
            if (user && user.user_metadata?.plan) {
                window.location.href = `/pricing.html?plan=${user.user_metadata.plan}`;
                return;
            }

            // If user is logged in but has no plan, show plan selection
            if (user && !user.user_metadata?.plan) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('plan-selection').style.display = 'block';
                return;
            }

            // If not logged in, process the token from the URL hash
            await window.netlifyIdentity.gotrue.handleAuthCallback();
            const newUser = window.netlifyIdentity.currentUser();

            if (newUser && !newUser.user_metadata?.plan) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('plan-selection').style.display = 'block';
            } else if (newUser && newUser.user_metadata?.plan) {
                window.location.href = `/pricing.html?plan=${newUser.user_metadata.plan}`;
            } else {
                document.getElementById('loading').innerHTML = 'Error: Could not log you in. Please try signing up again.';
            }
        }

        processConfirmationToken();

        // Save plan selection to user metadata
        document.querySelectorAll('[data-plan]').forEach(button => {
            button.addEventListener('click', async (event) => {
                const plan = event.currentTarget.getAttribute('data-plan');
                const user = window.netlifyIdentity.currentUser();
                if (user) {
                    try {
                        await user.update({ user_metadata: { ...user.user_metadata, plan: plan } });
                        window.location.href = `/pricing.html?plan=${plan}`;
                    } catch (error) {
                        console.error("Failed to save plan:", error);
                        alert("Could not save your plan. Please try again.");
                    }
                }
            });
        });
    </script>
</body>
</html>
