<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Sign Up – Genesis Craft AI</title>
  <meta name="description" content="Create your account to start generating full‑stack applications with AI.">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Favicon link tags -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="manifest" href="/site.webmanifest">
  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-HS1Z82VML7"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-HS1Z82VML7');
  </script>
  <!-- Schema Markup (Organization) -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Genesis Craft AI",
      "url": "https://genesiscraft.ai",
      "logo": "https://genesiscraft.ai/logo-lockup.svg",
      "sameAs": [
        "https://twitter.com/genesiscraft_ai",
        "https://github.com/genesiscraft-ai",
        "https://linkedin.com/company/genesiscraft-ai"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "support@genesiscraft.ai",
        "contactType": "customer support"
      }
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
      font-family: 'Inter', sans-serif;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .site-header {
      background: #0a0a0a;
      border-bottom: 1px solid #1e293b;
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    .logo a {
      display: inline-block;
    }
    .logo img {
      height: 32px;
      width: auto;
      vertical-align: middle;
    }
    .main-nav ul {
      display: flex;
      gap: 2rem;
      list-style: none;
    }
    .main-nav a {
      color: #cbd5e1;
      text-decoration: none;
      font-weight: 500;
    }
    .main-nav a:hover { color: #3b82f6; }
    .btn-small {
      background: #3b82f6;
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 40px;
      text-decoration: none;
      font-weight: 600;
    }
    .container {
      max-width: 500px;
      margin: 3rem auto;
      padding: 2rem;
      background: #0f172a;
      border-radius: 32px;
      border: 1px solid #1e293b;
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #fff, #94a3b8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .subhead {
      color: #94a3b8;
      margin-bottom: 2rem;
    }
    .form-group { margin-bottom: 1rem; text-align: left; }
    label { display: block; margin-bottom: 0.3rem; font-weight: 500; }
    input, select {
      width: 100%;
      padding: 0.8rem;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      color: white;
      font-family: inherit;
    }
    input:focus, select:focus { outline: none; border-color: #3b82f6; }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 0.8rem;
      border-radius: 40px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      margin-top: 0.5rem;
    }
    button:hover { background: #2563eb; }
    .footer {
      margin-top: auto;
      background: #0f172a;
      border-top: 1px solid #1e293b;
      padding: 2rem;
      text-align: center;
    }
    .footer a {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.8rem;
      margin: 0 0.5rem;
    }
    .error, .success {
      padding: 0.75rem;
      border-radius: 12px;
      margin-top: 1rem;
      text-align: center;
    }
    .error { background: rgba(239,68,68,0.2); border: 1px solid #ef4444; color: #f87171; }
    .success { background: rgba(16,185,129,0.2); border: 1px solid #10b981; color: #10b981; }
    @media (max-width: 700px) {
      .header-container { flex-direction: column; gap: 1rem; }
      .main-nav ul { gap: 1rem; flex-wrap: wrap; justify-content: center; }
      .logo img { height: 24px; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-container">
      <div class="logo">
        <a href="/index.html">
          <picture>
            <source media="(max-width: 768px)" srcset="/logo-icon.svg">
            <img src="/logo-lockup.svg" alt="Genesis Craft AI">
          </picture>
        </a>
      </div>
      <nav class="main-nav">
        <ul>
          <li><a href="/product.html">Product</a></li>
          <li><a href="/pricing.html">Pricing</a></li>
          <li><a href="/about.html">About Us</a></li>
          <li><a href="/careers.html">Careers</a></li>
          <li><a href="/contact.html">Contact</a></li>
        </ul>
      </nav>
      <div class="header-cta">
        <a href="/signup.html" class="btn-small">Sign Up</a>
      </div>
    </div>
  </header>

  <div class="container">
    <h1>Create your account</h1>
    <div class="subhead">Start building full‑stack applications in minutes.</div>

    <form id="signupForm" action="https://formspree.io/f/xvzlvryw" method="POST">
      <input type="hidden" name="_subject" value="New signup via website">
      <input type="hidden" name="_replyto" value="email">
      <div class="form-group">
        <label>Full Name *</label>
        <input type="text" name="fullname" required>
      </div>
      <div class="form-group">
        <label>E-mail Address *</label>
        <input type="email" name="email" required>
      </div>
      <div class="form-group">
        <label>Company (optional)</label>
        <input type="text" name="company">
      </div>
      <div class="form-group">
        <label>How did you hear about us?</label>
        <select name="source">
          <option>Search engine</option>
          <option>Social media</option>
          <option>Referral</option>
          <option>Podcast / YouTube</option>
          <option>Other</option>
        </select>
      </div>
      <button type="submit">Sign Up →</button>
    </form>
    <div id="formSuccess" class="success" style="display: none;"></div>
    <div id="formError" class="error" style="display: none;"></div>
    <p class="subhead" style="margin-top: 1rem; font-size: 0.8rem;">
      By signing up, you agree to our <a href="/terms-of-service.html" style="color:#3b82f6;">Terms</a> and <a href="/privacy-policy.html" style="color:#3b82f6;">Privacy Policy</a>.
    </p>
  </div>

  <footer class="footer">
    <a href="/privacy-policy.html">Privacy Policy</a> |
    <a href="/terms-of-service.html">Terms of Service</a> |
    <a href="/contact.html">Contact</a>
  </footer>

  <script>
    const form = document.getElementById('signupForm');
    const successDiv = document.getElementById('formSuccess');
    const errorDiv = document.getElementById('formError');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(form);
      try {
        const response = await fetch(form.action, {
          method: 'POST',
          body: formData,
          headers: { 'Accept': 'application/json' }
        });
        if (response.ok) {
          successDiv.innerText = '🎉 Account created! Please check your e-mail for a confirmation (if enabled) and then choose your plan.';
          successDiv.style.display = 'block';
          errorDiv.style.display = 'none';
          form.reset();
          const email = formData.get('email');
          setTimeout(() => {
            window.location.href = `/choose-plan.html?email=${encodeURIComponent(email)}`;
          }, 2000);
        } else {
          throw new Error('Submission failed');
        }
      } catch (err) {
        errorDiv.innerText = 'An error occurred. Please try again or contact support.';
        errorDiv.style.display = 'block';
        successDiv.style.display = 'none';
      }
    });
  </script>
</body>
</html>
