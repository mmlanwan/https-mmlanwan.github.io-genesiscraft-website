<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug – Choose Plan</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
        body { background: #0a0a0a; color: #e2e8f0; font-family: monospace; padding: 2rem; }
        .log { background: #1e293b; padding: 1rem; border-radius: 8px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>Debugging Confirmation</h1>
    <div id="log" class="log"></div>

    <script>
        const logDiv = document.getElementById('log');
        function log(msg) {
            logDiv.innerText += msg + '\n';
            console.log(msg);
        }

        log('=== Starting ===');
        log('Full URL: ' + window.location.href);
        log('Search params: ' + window.location.search);

        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('confirmation_token');
        log('Token from query param: ' + (token ? token.substring(0, 20) + '...' : 'null'));

        const netlifyIdentity = window.netlifyIdentity;
        netlifyIdentity.init();
        log('Netlify Identity initialized.');

        async function process() {
            if (token) {
                log('Attempting handleAuthCallback...');
                try {
                    await netlifyIdentity.gotrue.handleAuthCallback();
                    log('handleAuthCallback succeeded.');
                } catch (err) {
                    log('handleAuthCallback error: ' + err.message);
                }
            } else {
                log('No token found in URL.');
            }

            const user = netlifyIdentity.currentUser();
            log('Current user: ' + (user ? user.email : 'null'));
            if (user) {
                log('User metadata: ' + JSON.stringify(user.user_metadata, null, 2));
            }
        }

        process();
    </script>
</body>
</html>
