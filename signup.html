<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up – Genesis Craft AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Analytics (GA4) tag -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-HS1Z82VML7"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-HS1Z82VML7');
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            font-family: 'Inter', sans-serif;
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .container {
            max-width: 500px;
            margin: 4rem auto;
            padding: 2rem;
            background: #0f172a;
            border-radius: 32px;
            border: 1px solid #1e293b;
        }
        h1 {
            font-size: 2rem;
            text-align: center;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fff, #94a3b8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .subhead {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 2rem;
        }
        .plan-badge {
            background: #1e293b;
            padding: 0.5rem 1rem;
            border-radius: 40px;
            text-align: center;
            display: inline-block;
            width: auto;
            margin: 0 auto 1.5rem;
            font-size: 0.9rem;
            color: #3b82f6;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-bottom: 0.3rem;
            font-weight: 500;
        }
        input, select {
            width: 100%;
            padding: 0.8rem;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            color: white;
            font-family: inherit;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #3b82f6;
        }
        button {
            width: 100%;
            background: #3b82f6;
            color: white;
            border: none;
            padding: 0.8rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        button:hover {
            background: #2563eb;
        }
        .footer {
            margin-top: auto;
            background: #0f172a;
            border-top: 1px solid #1e293b;
            padding: 2rem;
            text-align: center;
        }
        .footer a { color: #94a3b8; text-decoration: none; font-size: 0.8rem; margin: 0 0.5rem; }
        .footer a:hover { color: #3b82f6; }
        .error { color: #ef4444; font-size: 0.8rem; margin-top: 0.3rem; }
        .success { text-align: center; color: #10b981; margin-top: 1rem; }

        /* Header styles */
        .site-header {
            background: #0a0a0a;
            border-bottom: 1px solid #1e293b;
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .logo a {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #94a3b8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-decoration: none;
        }
        .main-nav ul {
            display: flex;
            gap: 2rem;
            list-style: none;
            margin: 0;
            padding: 0;
        }
        .main-nav a {
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 500;
        }
        .main-nav a:hover {
            color: #3b82f6;
        }
        .btn-small {
            background: #3b82f6;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 600;
        }
        @media (max-width: 700px) {
            .header-container {
                flex-direction: column;
                gap: 1rem;
            }
            .main-nav ul {
                gap: 1rem;
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<header class="site-header">
    <div class="header-container">
        <div class="logo">
            <a href="/index.html">Genesis Craft AI</a>
        </div>
        <nav class="main-nav">
            <ul>
                <li><a href="/product.html">Product</a></li>
                <li><a href="/pricing.html">Pricing</a></li>
                <li><a href="/about.html">About</a></li>
                <li><a href="/careers.html">Careers</a></li>
                <li><a href="/contact.html">Contact</a></li>
            </ul>
        </nav>
        <div class="header-cta">
            <a href="/signup.html" class="btn-small">Sign Up</a>
        </div>
    </div>
</header>

<div class="container">
    <h1>Create your account</h1>
    <div class="subhead">Start building full‑stack applications in minutes</div>

    <div id="planDisplay" class="plan-badge"></div>

    <form id="signupForm" action="https://formspree.io/f/xvzlvryw" method="POST">
        <input type="hidden" name="_subject" value="New signup via website">
        <input type="hidden" name="_replyto" value="email">
        <!-- Plan will be added as hidden field by JS -->
        <input type="hidden" name="plan" id="planField">
        <div class="form-group">
            <label>Full Name *</label>
            <input type="text" name="fullname" required>
        </div>
        <div class="form-group">
            <label>Email Address *</label>
            <input type="email" name="email" required>
        </div>
        <div class="form-group">
            <label>Password *</label>
            <input type="password" name="password" required>
        </div>
        <div class="form-group">
            <label>Company (optional)</label>
            <input type="text" name="company">
        </div>
        <div class="form-group">
            <label>How did you hear about us?</label>
            <select name="source">
                <option>Search engine</option>
                <option>Social media</option>
                <option>Referral</option>
                <option>Podcast / YouTube</option>
                <option>Other</option>
            </select>
        </div>
        <button type="submit">Start Building Free</button>
    </form>
    <div id="formSuccess" style="display:none;" class="success"></div>
    <div id="formError" style="display:none;" class="error"></div>
</div>

<div class="footer">
    <a href="/privacy-policy.html">Privacy Policy</a> | <a href="/terms-of-service.html">Terms of Service</a> | <a href="/contact.html">Contact</a>
</div>

<script>
    // Get plan from URL parameter
    const urlParams = new URLSearchParams(window.location.search);
    let plan = urlParams.get('plan');
    if (!plan || !['free', 'pro', 'team'].includes(plan)) plan = 'free';
    const planDisplay = document.getElementById('planDisplay');
    const planField = document.getElementById('planField');
    const planNames = { free: 'Free', pro: 'Pro', team: 'Team' };
    planDisplay.innerText = `Selected plan: ${planNames[plan]}`;
    planField.value = plan;

    // Handle form submission with Formspree
    const form = document.getElementById('signupForm');
    const successDiv = document.getElementById('formSuccess');
    const errorDiv = document.getElementById('formError');
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(form);
        try {
            const response = await fetch(form.action, {
                method: 'POST',
                body: formData,
                headers: { 'Accept': 'application/json' }
            });
            if (response.ok) {
                successDiv.innerText = '🎉 Account created! Please check your e-mail to verify. (Simulated – you will receive a confirmation soon.)';
                successDiv.style.display = 'block';
                form.reset();
                errorDiv.style.display = 'none';
            } else {
                throw new Error('Submission failed');
            }
        } catch (err) {
            errorDiv.innerText = 'An error occurred. Please try again or contact support.';
            errorDiv.style.display = 'block';
        }
    });
</script>
</body>
</html>
