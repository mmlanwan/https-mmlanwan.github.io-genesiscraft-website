<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Genesis Craft AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <style>
    /* Same styles as signup.html (reuse the same CSS) */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
      font-family: 'Inter', sans-serif;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .site-header { background: #0a0a0a; border-bottom: 1px solid #1e293b; padding: 1rem 2rem; }
    .header-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
    .logo a { display: inline-block; }
    .logo img { height: 32px; width: auto; vertical-align: middle; }
    .main-nav ul { display: flex; gap: 2rem; list-style: none; }
    .main-nav a { color: #cbd5e1; text-decoration: none; font-weight: 500; }
    .main-nav a:hover { color: #3b82f6; }
    .btn-small { background: #3b82f6; color: white; padding: 0.5rem 1rem; border-radius: 40px; text-decoration: none; font-weight: 600; }
    .container { max-width: 500px; margin: 3rem auto; padding: 2rem; background: #0f172a; border-radius: 32px; border: 1px solid #1e293b; text-align: center; }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; background: linear-gradient(135deg, #fff, #94a3b8); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .subhead { color: #94a3b8; margin-bottom: 2rem; }
    .form-group { margin-bottom: 1rem; text-align: left; }
    label { display: block; margin-bottom: 0.3rem; font-weight: 500; }
    input { width: 100%; padding: 0.8rem; background: #1e293b; border: 1px solid #334155; border-radius: 12px; color: white; font-family: inherit; }
    input:focus { outline: none; border-color: #3b82f6; }
    .password-wrapper { position: relative; }
    .password-wrapper input { padding-right: 3rem; }
    .toggle-password { position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: #94a3b8; cursor: pointer; padding: 0; font-size: 1.2rem; width: auto; margin: 0; }
    button[type="submit"] { background: #3b82f6; color: white; border: none; padding: 0.8rem; border-radius: 40px; font-weight: 600; font-size: 1rem; cursor: pointer; width: 100%; margin-top: 0.5rem; }
    button[type="submit"]:hover { background: #2563eb; }
    button[type="submit"]:disabled { opacity: 0.6; cursor: not-allowed; }
    .footer { margin-top: auto; background: #0f172a; border-top: 1px solid #1e293b; padding: 2rem; text-align: center; }
    .footer a { color: #94a3b8; text-decoration: none; font-size: 0.8rem; margin: 0 0.5rem; }
    .error, .success { padding: 0.75rem; border-radius: 12px; margin-top: 1rem; text-align: center; }
    .error { background: rgba(239,68,68,0.2); border: 1px solid #ef4444; color: #f87171; }
    .success { background: rgba(16,185,129,0.2); border: 1px solid #10b981; color: #10b981; }
    .spinner { display: inline-block; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top: 3px solid #fff; width: 20px; height: 20px; animation: spin 1s linear infinite; margin-right: 8px; vertical-align: middle; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @media (max-width: 700px) { .header-container { flex-direction: column; gap: 1rem; } .main-nav ul { gap: 1rem; flex-wrap: wrap; justify-content: center; } .logo img { height: 24px; } }
    .auth-link { margin-top: 1.5rem; font-size: 0.9rem; color: #94a3b8; }
    .auth-link a { color: #3b82f6; text-decoration: none; }
    .auth-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-container">
      <div class="logo">
        <a href="/index.html">
          <picture>
            <source media="(max-width: 768px)" srcset="/logo-icon.svg">
            <img src="/logo-lockup.svg" alt="Genesis Craft AI">
          </picture>
        </a>
      </div>
      <nav class="main-nav">
        <ul>
          <li><a href="/product.html">Product</a></li>
          <li><a href="/pricing.html">Pricing</a></li>
          <li><a href="/about.html">About Us</a></li>
          <li><a href="/careers.html">Careers</a></li>
          <li><a href="/contact.html">Contact</a></li>
        </ul>
      </nav>
      <div class="header-cta">
        <a href="/signup.html" class="btn-small">Sign Up</a>
      </div>
    </div>
  </header>

  <div class="container">
    <h1>Welcome Back</h1>
    <div class="subhead">Log in to continue building with AI.</div>

    <form id="loginForm">
      <div class="form-group">
        <label>Email Address *</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group">
        <label>Password *</label>
        <div class="password-wrapper">
          <input type="password" id="password" required minlength="8">
          <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>
      <button type="submit" id="submitBtn">Log In →</button>
    </form>

    <div id="formError" class="error" style="display: none;"></div>
    <div id="formSuccess" class="success" style="display: none;"></div>

    <div class="auth-link">
      Don’t have an account? <a href="/signup.html">Sign up</a>
    </div>
  </div>

  <footer class="footer">
    <a href="/privacy-policy.html">Privacy Policy</a> |
    <a href="/terms-of-service.html">Terms of Service</a> |
    <a href="/contact.html">Contact</a>
  </footer>

  <script>
    const form = document.getElementById('loginForm');
    const errorDiv = document.getElementById('formError');
    const successDiv = document.getElementById('formSuccess');
    const submitBtn = document.getElementById('submitBtn');

    // Toggle password
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    togglePassword.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      togglePassword.querySelector('i').classList.toggle('fa-eye');
      togglePassword.querySelector('i').classList.toggle('fa-eye-slash');
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        errorDiv.innerText = 'Please fill in all fields.';
        errorDiv.style.display = 'block';
        successDiv.style.display = 'none';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Logging in...';

      try {
        const response = await fetch('https://api.genesiscraft.ai/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const result = await response.json();

        if (response.ok) {
          localStorage.setItem('token', result.access_token);
          localStorage.setItem('user_email', email);
          successDiv.innerText = '✅ Logged in! Redirecting...';
          successDiv.style.display = 'block';
          errorDiv.style.display = 'none';
          setTimeout(() => {
            window.location.href = `https://app.genesiscraft.ai/dashboard#token=${encodeURIComponent(result.access_token)}`;
          }, 1500);
        } else {
          errorDiv.innerText = `❌ ${result.detail || 'Invalid credentials. Please try again.'}`;
          errorDiv.style.display = 'block';
          successDiv.style.display = 'none';
        }
      } catch (err) {
        errorDiv.innerText = 'Network error. Please check your connection.';
        errorDiv.style.display = 'block';
        successDiv.style.display = 'none';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Log In →';
      }
    });
  </script>
</body>
</html>
