<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You – Genesis Craft AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%); font-family: 'Inter', sans-serif; color: #e2e8f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; }
        .container { max-width: 600px; padding: 2rem; background: #0f172a; border-radius: 32px; border: 1px solid #1e293b; }
        h1 { font-size: 2rem; margin-bottom: 1rem; background: linear-gradient(135deg, #fff, #94a3b8); -webkit-background-clip: text; background-clip: text; color: transparent; }
        p { color: #cbd5e1; margin-bottom: 2rem; }
        .btn { background: #3b82f6; color: white; padding: 0.75rem 1.5rem; border-radius: 40px; text-decoration: none; font-weight: 600; }
        .btn:hover { background: #2563eb; }
    </style>
</head>
<body>
<div class="container">
    <h1>Thank You for Signing Up! 🎉</h1>
    <p>We've received your registration. Please check your e-mail for a verification link. (If you don't see it, check your spam folder.)</p>
    <p>Our team will review your account and you'll hear from us soon.</p>
    <a href="/index.html" class="btn">Back to Home</a>
</div>
</body>
</html>
