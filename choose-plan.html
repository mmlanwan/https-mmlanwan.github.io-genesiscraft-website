<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Token Exchange</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
        body { background: #0a0a0a; color: #e2e8f0; font-family: monospace; padding: 2rem; }
        .log { background: #1e293b; padding: 1rem; border-radius: 8px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>Debug Token Exchange</h1>
    <div id="log" class="log"></div>
    <script>
        const logDiv = document.getElementById('log');
        function log(msg) { logDiv.innerText += msg + '\n'; console.log(msg); }

        log('=== Start ===');
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('confirmation_token');
        log('Token present: ' + (token ? 'yes' : 'no'));
        if (token) log('Token prefix: ' + token.substring(0, 20) + '...');

        if (!token) {
            log('ERROR: No token in URL.');
        } else {
            log('Fetching /.netlify/identity/verify...');
            fetch('/.netlify/identity/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: token })
            })
            .then(async response => {
                log('Response status: ' + response.status);
                const text = await response.text();
                log('Response body: ' + text);
                if (response.ok) {
                    log('SUCCESS: Token exchanged.');
                } else {
                    log('FAILURE: Token exchange failed.');
                }
            })
            .catch(err => {
                log('FETCH ERROR: ' + err.message);
            });
        }
    </script>
</body>
</html>
