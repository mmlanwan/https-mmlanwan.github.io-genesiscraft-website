<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Sign Up – Genesis Craft AI</title>
  <meta name="description" content="Create your account to start generating full‑stack applications with AI.">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Favicon link tags -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="manifest" href="/site.webmanifest">
  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-HS1Z82VML7"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-HS1Z82VML7');
  </script>
  <!-- Schema Markup (Organization) -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Genesis Craft AI",
      "url": "https://genesiscraft.ai",
      "logo": "https://genesiscraft.ai/logo-lockup.svg",
      "sameAs": [
        "https://twitter.com/genesiscraft_ai",
        "https://github.com/genesiscraft-ai",
        "https://linkedin.com/company/genesiscraft-ai"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "support@genesiscraft.ai",
        "contactType": "customer support"
      }
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
      font-family: 'Inter', sans-serif;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .site-header {
      background: #0a0a0a;
      border-bottom: 1px solid #1e293b;
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    .logo a { display: inline-block; }
    .logo img {
      height: 32px;
      width: auto;
      vertical-align: middle;
    }
    .main-nav ul {
      display: flex;
      gap: 2rem;
      list-style: none;
    }
    .main-nav a {
      color: #cbd5e1;
      text-decoration: none;
      font-weight: 500;
    }
    .main-nav a:hover { color: #3b82f6; }
    .btn-small {
      background: #3b82f6;
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 40px;
      text-decoration: none;
      font-weight: 600;
    }
    .container {
      max-width: 500px;
      margin: 3rem auto;
      padding: 2rem;
      background: #0f172a;
      border-radius: 32px;
      border: 1px solid #1e293b;
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #fff, #94a3b8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .subhead {
      color: #94a3b8;
      margin-bottom: 2rem;
    }
    .form-group { margin-bottom: 1rem; text-align: left; }
    label { display: block; margin-bottom: 0.3rem; font-weight: 500; }
    input, select {
      width: 100%;
      padding: 0.8rem;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      color: white;
      font-family: inherit;
    }
    input:focus, select:focus { outline: none; border-color: #3b82f6; }
    .password-wrapper {
      position: relative;
    }
    .password-wrapper input {
      padding-right: 3rem;
    }
    .toggle-password {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      padding: 0;
      font-size: 1.2rem;
      width: auto;
      margin: 0;
    }
    .toggle-password:hover { color: #e2e8f0; }
    button[type="submit"] {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 0.8rem;
      border-radius: 40px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      margin-top: 0.5rem;
    }
    button[type="submit"]:hover { background: #2563eb; }
    button[type="submit"]:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .footer {
      margin-top: auto;
      background: #0f172a;
      border-top: 1px solid #1e293b;
      padding: 2rem;
      text-align: center;
    }
    .footer a {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.8rem;
      margin: 0 0.5rem;
    }
    .error, .success {
      padding: 0.75rem;
      border-radius: 12px;
      margin-top: 1rem;
      text-align: center;
    }
    .error { background: rgba(239,68,68,0.2); border: 1px solid #ef4444; color: #f87171; }
    .success { background: rgba(16,185,129,0.2); border: 1px solid #10b981; color: #10b981; }
    .spinner {
      display: inline-block;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top: 3px solid #fff;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @media (max-width: 700px) {
      .header-container { flex-direction: column; gap: 1rem; }
      .main-nav ul { gap: 1rem; flex-wrap: wrap; justify-content: center; }
      .logo img { height: 24px; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-container">
      <div class="logo">
        <a href="/index.html">
          <picture>
            <source media="(max-width: 768px)" srcset="/logo-icon.svg">
            <img src="/logo-lockup.svg" alt="Genesis Craft AI">
          </picture>
        </a>
      </div>
      <nav class="main-nav">
        <ul>
          <li><a href="/product.html">Product</a></li>
          <li><a href="/pricing.html">Pricing</a></li>
          <li><a href="/about.html">About Us</a></li>
          <li><a href="/careers.html">Careers</a></li>
          <li><a href="/contact.html">Contact</a></li>
        </ul>
      </nav>
      <div class="header-cta">
        <a href="/signup.html" class="btn-small">Sign Up</a>
      </div>
    </div>
  </header>

  <div class="container">
    <h1>Create your account</h1>
    <div class="subhead">Start building full‑stack applications in minutes.</div>

    <form id="signupForm">
      <div class="form-group">
        <label>Full Name *</label>
        <input type="text" id="fullname" required>
      </div>
      <div class="form-group">
        <label>Email Address *</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group">
        <label>Password *</label>
        <div class="password-wrapper">
          <input type="password" id="password" required minlength="8">
          <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">
            <i class="fas fa-eye"></i>
          </button>
        </div>
        <small style="color:#94a3b8; display:block; margin-top:0.2rem;">At least 8 characters</small>
      </div>
      <div class="form-group">
        <label>Company (optional)</label>
        <input type="text" id="company">
      </div>
      <div class="form-group">
        <label>How did you hear about us?</label>
        <select id="source">
          <option>Search engine</option>
          <option>Social media</option>
          <option>Referral</option>
          <option>Podcast / YouTube</option>
          <option>Other</option>
        </select>
      </div>
      <button type="submit" id="submitBtn">Sign Up →</button>
    </form>

    <div id="formSuccess" class="success" style="display: none;"></div>
    <div id="formError" class="error" style="display: none;"></div>

    <p class="subhead" style="margin-top: 1rem; font-size: 0.8rem;">
      By signing up, you agree to our <a href="/terms-of-service.html" style="color:#3b82f6;">Terms</a> and <a href="/privacy-policy.html" style="color:#3b82f6;">Privacy Policy</a>.
    </p>
  </div>

  <footer class="footer">
    <a href="/privacy-policy.html">Privacy Policy</a> |
    <a href="/terms-of-service.html">Terms of Service</a> |
    <a href="/contact.html">Contact</a>
  </footer>

  <script>
    const form = document.getElementById('signupForm');
    const successDiv = document.getElementById('formSuccess');
    const errorDiv = document.getElementById('formError');
    const submitBtn = document.getElementById('submitBtn');

    // Toggle password visibility
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    togglePassword.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      togglePassword.querySelector('i').classList.toggle('fa-eye');
      togglePassword.querySelector('i').classList.toggle('fa-eye-slash');
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const fullname = document.getElementById('fullname').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const company = document.getElementById('company').value.trim();
      const source = document.getElementById('source').value;

      if (!fullname || !email || !password) {
        errorDiv.innerText = 'Please fill in all required fields.';
        errorDiv.style.display = 'block';
        successDiv.style.display = 'none';
        return;
      }

      if (password.length < 8) {
        errorDiv.innerText = 'Password must be at least 8 characters.';
        errorDiv.style.display = 'block';
        successDiv.style.display = 'none';
        return;
      }

      // Disable button and show spinner
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Creating account...';

      try {
        const response = await fetch('https://api.genesiscraft.ai/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email,
            password,
            full_name: fullname,
            company: company || null,
            source: source
          })
        });

        const result = await response.json();

        if (response.ok) {
          // Store JWT token in localStorage
          localStorage.setItem('token', result.access_token);
          localStorage.setItem('user_email', email);

          successDiv.innerText = '🎉 Account created! Redirecting to choose your plan...';
          successDiv.style.display = 'block';
          errorDiv.style.display = 'none';
          form.reset();

          setTimeout(() => {
            window.location.href = `/choose-plan.html?email=${encodeURIComponent(email)}`;
          }, 2000);
        } else {
          const errorMsg = result.detail || 'Signup failed. Please try again.';
          errorDiv.innerText = `❌ ${errorMsg}`;
          errorDiv.style.display = 'block';
          successDiv.style.display = 'none';
        }
      } catch (err) {
        errorDiv.innerText = 'Network error. Please check your connection and try again.';
        errorDiv.style.display = 'block';
        successDiv.style.display = 'none';
        console.error(err);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Sign Up →';
      }
    });
  </script>
</body>
</html>
