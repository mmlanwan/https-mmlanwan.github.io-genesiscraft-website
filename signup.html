<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up – Genesis Craft AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-HS1Z82VML7"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-HS1Z82VML7');
  </script>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
      font-family: 'Inter', sans-serif;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .site-header {
      background: #0a0a0a;
      border-bottom: 1px solid #1e293b;
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    .logo a {
      font-size: 1.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fff, #94a3b8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-decoration: none;
    }
    .main-nav ul {
      display: flex;
      gap: 2rem;
      list-style: none;
    }
    .main-nav a {
      color: #cbd5e1;
      text-decoration: none;
      font-weight: 500;
    }
    .main-nav a:hover { color: #3b82f6; }
    .btn-small {
      background: #3b82f6;
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 40px;
      text-decoration: none;
      font-weight: 600;
    }
    .container {
      max-width: 500px;
      margin: 3rem auto;
      padding: 2rem;
      background: #0f172a;
      border-radius: 32px;
      border: 1px solid #1e293b;
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #fff, #94a3b8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .subhead {
      color: #94a3b8;
      margin-bottom: 2rem;
    }
    .identity-button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 0.8rem 1.5rem;
      border-radius: 40px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
    }
    .identity-button:hover { background: #2563eb; }
    .footer {
      margin-top: auto;
      background: #0f172a;
      border-top: 1px solid #1e293b;
      padding: 2rem;
      text-align: center;
    }
    .footer a {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.8rem;
      margin: 0 0.5rem;
    }
    @media (max-width: 700px) {
      .header-container { flex-direction: column; gap: 1rem; }
      .main-nav ul { gap: 1rem; flex-wrap: wrap; justify-content: center; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-container">
      <div class="logo">
        <a href="/index.html">Genesis Craft AI</a>
      </div>
      <nav class="main-nav">
        <ul>
          <li><a href="/product.html">Product</a></li>
          <li><a href="/pricing.html">Pricing</a></li>
          <li><a href="/about.html">About Us</a></li>
          <li><a href="/careers.html">Careers</a></li>
          <li><a href="/contact.html">Contact</a></li>
        </ul>
      </nav>
      <div class="header-cta">
        <a href="/signup.html" class="btn-small">Sign Up</a>
      </div>
    </div>
  </header>

  <div class="container">
    <h1>Create your account</h1>
    <div class="subhead">Secure, password‑protected – your password never leaves your browser.</div>
    <button id="signupButton" class="identity-button">Sign up with email →</button>
    <p style="margin-top: 1.5rem; font-size: 0.8rem; color: #94a3b8;">
      Already have an account? <a href="/.netlify/identity/login" style="color:#3b82f6;">Log in</a>
    </p>
  </div>

  <footer class="footer">
    <a href="/privacy-policy.html">Privacy Policy</a> |
    <a href="/terms-of-service.html">Terms of Service</a> |
    <a href="/contact.html">Contact</a>
  </footer>

  <script>
    const netlifyIdentity = window.netlifyIdentity;
    netlifyIdentity.init();

    // If user is already logged in (e.g., after email confirmation), go to plan selection
    if (netlifyIdentity.currentUser()) {
      window.location.href = '/choose-plan.html';
    }

    document.getElementById('signupButton').addEventListener('click', () => {
      netlifyIdentity.open('signup');
    });

    netlifyIdentity.on('login', () => {
      window.location.href = '/choose-plan.html';
    });
  </script>
</body>
</html>
